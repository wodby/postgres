name: Supabase PostgreSQL variant
on:
  pull_request:
    paths:
      - 'Dockerfile.supabase'
      - 'supabase/**'
      - 'tests/supabase.sh'
      - 'scripts/test-supabase-ci.sh'
      - 'Makefile'
      - '.github/workflows/supabase.yml'
  push:
    branches: [master]
    tags: ['*']
    paths:
      - 'Dockerfile.supabase'
      - 'supabase/**'
      - 'tests/supabase.sh'
      - 'scripts/test-supabase-ci.sh'
      - 'Makefile'
      - '.github/workflows/supabase.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Wodby CLI
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          curl --fail --location "https://github.com/wodby/wodby-cli/releases/download/2.10.0/wodby-linux-${ARCH}.tar.gz" | sudo tar xz -C /usr/local/bin wodby
      - name: Select image tag
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          tag=17-supabase
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$tag-$GITHUB_REF_NAME"; fi
          echo "IMAGE=wodby/postgres:$tag-$ARCH" >> "$GITHUB_ENV"
      - name: Build and test through Wodby CLI
        run: bash scripts/test-supabase-ci.sh
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push tested architecture
        if: github.event_name == 'push'
        run: docker push "$IMAGE"
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish multi-architecture manifest
        run: |
          tag=17-supabase
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$tag-$GITHUB_REF_NAME"; fi
          docker buildx imagetools create -t "wodby/postgres:$tag" "wodby/postgres:$tag-amd64" "wodby/postgres:$tag-arm64"
